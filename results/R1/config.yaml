experiment: R1
description: Robustness to the strategy pool, rerun E1/E2 and E5 with three other pools
base_pool:
  - ALLC
  - ALLD
  - RAND
  - TFT
  - GRIM
  - {code: GTFT, g: 0.3333333333}
  - TF2T
  - WSLS
  - STFT
  - CTFT
  - JOSS
pools:
  nice_only: [ALLC, TFT, GRIM, {code: GTFT, g: 0.3333333333}, TF2T, WSLS, CTFT]
  many_exploiters:   # 6 exploiters vs 5 reciprocators
    [ALLD, STFT, JOSS, {code: JOSS, p: 0.3}, {code: JOSS, p: 0.5}, RAND,
     TFT, GRIM, {code: GTFT, g: 0.3333333333}, TF2T, WSLS]
random_subset: {size: 8, seed: 7}   # drawn from base_pool with numpy default_rng(7)
payoffs: {T: 5, R: 3, P: 1, S: 0}
delta: 0.99
epsilons: [0.0, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2]
evo_epsilons: [0.0, 0.01, 0.05]
scenarios: [uniform, many_defectors]
generations: 1000
n_reps: 50
seed: 42
