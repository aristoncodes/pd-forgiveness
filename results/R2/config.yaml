  - WSLS
  - STFT
  - CTFT
  - JOSS
payoffs: {T: 5, R: 3, P: 1, S: 0}
T_values: [4.5, 5.9]
delta: 0.99
epsilons: [0.0, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2]
evo_epsilons: [0.0, 0.01, 0.05]
scenarios: [uniform, many_defectors, wsls_resident]
