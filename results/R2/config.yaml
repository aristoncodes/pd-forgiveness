experiment: R2
description: Robustness to payoffs, T = 4.5 (WSLS strictly stable) and T = 5.9 (stronger temptation)
# The PRD asks for T = 6, but with R = 3, S = 0 that gives 2R = T + S, which is not a strict
# Prisoner's Dilemma (alternating exploitation would pay as much as cooperation). T = 5.9 is
# the closest valid value. See docs/decisions.md.
